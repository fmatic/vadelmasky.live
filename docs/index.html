
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VadelmaSky.live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1218;
    color: #e8edf2;
}

header {
    padding: 2rem;
    background: linear-gradient(135deg, #111827, #1f2937);
    border-bottom: 1px solid #263241;
}

h1 {
    margin: 0;
    font-size: 2.2rem;
}

.subtitle {
    color: #9ca3af;
    margin-top: .4rem;
}

main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.card {
    background: #171c24;
    border: 1px solid #293241;
    border-radius: 14px;
    padding: 1rem;
}

.card .value {
    font-size: 2rem;
    font-weight: 700;
    color: #7dd3fc;
}

.card .label {
    color: #9ca3af;
    margin-top: .25rem;
}

section {
    background: #171c24;
    border: 1px solid #293241;
    border-radius: 14px;
    padding: 1rem;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    text-align: left;
    padding: .65rem;
    border-bottom: 1px solid #293241;
    white-space: nowrap;
}

th {
    color: #93c5fd;
    font-weight: 600;
}

tr:hover {
    background: #1f2937;
}

footer {
    color: #6b7280;
    padding: 2rem;
    text-align: center;
    font-size: .9rem;
}
</style>
</head>

<body>
<header>
    <h1>VadelmaSky.live</h1>
    <div class="subtitle">Local ADS-B / aviation log from Jyväskylä, Finland</div>
</header>

<main>
    <div class="cards">
        <div class="card">
            <div class="value">0</div>
            <div class="label">Unique aircraft today</div>
        </div>

        <div class="card">
            <div class="value">0</div>
            <div class="label">Aircraft currently visible</div>
        </div>

        <div class="card">
            <div class="value">2026-05-04 17:39:01</div>
            <div class="label">Last update UTC</div>
        </div>
    </div>

    <section>
        <h2>Latest aircraft</h2>
        <table>
            <thead>
                <tr>
                    <th>Flight</th>
                    <th>ICAO</th>
                    <th>Altitude</th>
                    <th>Lat</th>
                    <th>Lon</th>
                    <th>Last seen UTC</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </section>
</main>

<footer>
    VadelmaSky.live · Powered by local SDR receivers
</footer>
</body>
</html>
